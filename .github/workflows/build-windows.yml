name: Build Candle PCB (Windows)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get Candle v1.1.8 source and apply PCB patch
        shell: bash
        run: |
          git clone --depth 1 --branch v1.1.8 https://github.com/Denvi/Candle.git candle
          # Windows checkout may convert the patch to CRLF; convert back to LF
          sed -i 's/\r$//' candle_pcb_vi.patch
          cd candle
          git apply --whitespace=nowarn --exclude='*.qm' ../candle_pcb_vi.patch

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-make
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-serialport
            mingw-w64-x86_64-qt5-winextras
            mingw-w64-x86_64-qt5-declarative
            mingw-w64-x86_64-qt5-tools

      - name: Build
        shell: msys2 {0}
        run: |
          cd candle/src
          # 64-bit ld does not know the 32-bit-only --large-address-aware flag
          sed -i '/large-address-aware/d' candle.pro
          lrelease-qt5 translations/candle_vi.ts -qm translations/candle_vi.qm
          qmake-qt5 candle.pro CONFIG+=release
          mingw32-make -j4

      - name: Package
        shell: msys2 {0}
        run: |
          mkdir -p dist/translations
          cp candle/src/release/Candle.exe dist/
          cp candle/src/translations/candle_vi.qm dist/translations/
          windeployqt-qt5 --release --no-translations --no-angle --no-opengl-sw --no-system-d3d-compiler dist/Candle.exe || echo "windeployqt returned non-zero, continuing with manual copy"
          # Make sure the platform plugin and every MinGW/Qt DLL dependency is present
          mkdir -p dist/platforms
          cp -n /mingw64/share/qt5/plugins/platforms/qwindows.dll dist/platforms/ || cp -n /mingw64/lib/qt5/plugins/platforms/qwindows.dll dist/platforms/
          for f in dist/Candle.exe dist/platforms/qwindows.dll; do
            ldd "$f" | grep -i '/mingw64/' | awk '{print $3}' | while read d; do cp -n "$d" dist/; done
          done
          ls -R dist

      - uses: actions/upload-artifact@v4
        with:
          name: Candle_PCB_Windows
          path: dist
